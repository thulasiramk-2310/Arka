<rect x="4" y="5.5" width="56" height="56" rx="13" fill="#000" opacity=".16"/>
<rect x="4" y="4" width="56" height="56" rx="13" fill="url(#g)"/>
<rect x="4.5" y="4.5" width="55" height="55" rx="12.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
<!-- A shield with a flat top and cut corners (the ArkaOS cut), sized like the symbols of the other apps. -->
<path d="M23 14 H41 L45.5 18.5 V31 C45.5 40.5 39 46.5 32 50.5 C25 46.5 18.5 40.5 18.5 31 V18.5 Z" fill="#000" opacity=".16" transform="translate(0 1.3)"/>
