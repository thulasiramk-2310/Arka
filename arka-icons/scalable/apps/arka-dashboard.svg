<svg xmlns="http://www.w3.org/2000/svg" viewBox="113 110 1025 1025">
<!-- Privacy Dashboard: the ArkaOS "A" with a progress ring and signal bars on a dark tile. Rebuilt as a vector from the supplied artwork so it stays sharp at every size. -->
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18222b"/><stop offset="1" stop-color="#0c1219"/></linearGradient>
<linearGradient id="leg" gradientUnits="userSpaceOnUse" x1="470" y1="290" x2="930" y2="890"><stop offset="0" stop-color="#7efde1"/><stop offset=".55" stop-color="#3ad29b"/><stop offset="1" stop-color="#2cae85"/></linearGradient>
<linearGradient id="chev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5bf8d0"/><stop offset="1" stop-color="#54f4c9"/></linearGradient>
<linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="571" y1="0" x2="680" y2="0"><stop offset="0" stop-color="#f4f8f9"/><stop offset="1" stop-color="#b3f7e7"/></linearGradient>
<linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3dfac3"/><stop offset="1" stop-color="#10f9ac"/></linearGradient>
<clipPath id="inside"><path d="M626 434 L292 886 L958 887 Z"/></clipPath>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2fe0a0" stop-opacity=".34"/><stop offset="1" stop-color="#2fe0a0" stop-opacity="0"/></radialGradient>
</defs>

<rect x="133" y="130" width="985" height="985" rx="230" fill="url(#tile)"/>
<rect x="134.5" y="131.5" width="982" height="982" rx="228.5" fill="none" stroke="url(#rim)" stroke-width="4"/>
<g clip-path="url(#inside)"><circle cx="330" cy="880" r="190" fill="url(#glow)"/><circle cx="925" cy="880" r="190" fill="url(#glow)"/></g>
<!-- the A: two tapering legs -->
<path d="M626 282 L966 897 L958 887 L626 434 L292 886 L286 895 Z" fill="url(#leg)"/>
<!-- the base chevron -->
<path d="M286 895 L626 808 L966 897 L626 879 Z" fill="url(#chev)"/>
<!-- progress ring and bars -->
<circle cx="626" cy="690" r="118" fill="none" stroke="#3b4d58" stroke-width="13"/>
<path d="M626.0 572.0 A118 118 0 0 1 742.9 673.6" fill="none" stroke="url(#arc)" stroke-width="13" stroke-linecap="round"/>
<rect x="571" y="695" width="15" height="27" rx="7.5" fill="url(#bar)"/>
<rect x="603" y="678" width="15" height="44" rx="7.5" fill="url(#bar)"/>
<rect x="633" y="660" width="15" height="62" rx="7.5" fill="url(#bar)"/>
<rect x="664" y="645" width="15" height="77" rx="7.5" fill="url(#bar)"/>
</svg>
