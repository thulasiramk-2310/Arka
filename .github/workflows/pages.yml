name: Deploy website to GitHub Pages

# Publishes the static site in website/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment →
#   Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a new push cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on via this workflow's token — no manual Settings step
      # Videos live on the "media" GitHub Release, not in the repository. They
      # are copied into the published site here, so the page plays them from
      # its own address. A missing video never blocks a deploy.
      - name: Fetch videos from the media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/media
          gh release download media --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir website/media \
            || echo "No media release yet; deploying without videos."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
