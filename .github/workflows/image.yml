name: Image

# Builds the ArkaOS bootc image, splits it into many small layers so an update
# downloads only what changed, signs it, and publishes it to
# ghcr.io/thulasiramk-2310/arka. Installed systems only accept images signed
# with the key whose public half is cosign.pub (see containers/).

on:
  push:
    # test/* branches are built and checked but never published.
    branches: [master, "test/**"]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "assets/**"
      - "**.md"
  schedule:
    - cron: "17 3 * * 1"   # weekly, to pick up Fedora security updates
  workflow_dispatch:
    inputs:
      fresh:
        description: "Build from nothing (no cache) and replace the cache; use after a base image or package problem"
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/thulasiramk-2310/arka
  # Build layers are kept here, so a build that changes only a late file reuses the big early
  # ones (package installs, compiles). It is a cache, never installed: only $IMAGE is signed
  # and published.
  CACHE: ghcr.io/thulasiramk-2310/arka-buildcache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Refuse to publish without the signing key
        if: github.ref == 'refs/heads/master'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            echo "::error::SIGNING_SECRET is not set; an unsigned image would be rejected by ArkaOS"
            exit 1
          fi

      - name: Make room (the image is about 12 GB, built twice)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          FRESH: ${{ github.event_name == 'schedule' || inputs.fresh }}
          SOURCE_URL: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          # The weekly run (which exists to pick up Fedora security updates) and a manual "fresh"
          # run ignore the cache and then replace it; every other run reuses it. Reusing a cached
          # package layer means its packages are as old as that layer, which is why the weekly
          # run must rebuild them.
          if [ "$FRESH" = true ]; then OPTS="--no-cache"; else OPTS="--cache-from $CACHE"; fi
          # The build runs in a current podman: the one on the Ubuntu runner (4.9) fails to push
          # build cache ("image not known"). The layers still go into the host's /var/lib/containers.
          sudo podman run --rm --privileged --user root --security-opt label=disable \
            -v /var/lib/containers:/var/lib/containers -v "$PWD":/src -w /src \
            -e TOKEN="$TOKEN" -e ACTOR="$ACTOR" -e OPTS="$OPTS" -e CACHE="$CACHE" -e SOURCE_URL="$SOURCE_URL" -e REVISION="$REVISION" \
            quay.io/podman/stable:latest sh -c '
              set -eu
              podman version | head -2
              echo "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
              podman build --pull=newer --layers $OPTS --cache-to "$CACHE" \
                --label "org.opencontainers.image.source=$SOURCE_URL" \
                --label "org.opencontainers.image.revision=$REVISION" \
                -t localhost/arka:build .
            '

      - name: Split into small layers
        run: |
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:44 \
            rpm-ostree compose build-chunked-oci --bootc --format-version=1 \
              --from=localhost/arka:build \
              --output=containers-storage:localhost/arka:chunked
          sudo podman rmi localhost/arka:build
          sudo podman image inspect localhost/arka:chunked --format '{{len .RootFS.Layers}} layers'

      - name: Push
        if: github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          ver=44.$(date -u +%Y%m%d)
          sudo podman push --digestfile digest localhost/arka:chunked "docker://$IMAGE:latest"
          sudo podman push localhost/arka:chunked "docker://$IMAGE:$ver"
          sudo podman push localhost/arka:chunked "docker://$IMAGE:sha-${GITHUB_SHA::7}"
          echo "DIGEST=$(sudo cat digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/master'
        with:
          cosign-release: v2.4.1

      - name: Sign and verify
        if: github.ref == 'refs/heads/master'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "$TOKEN"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          echo "Published and signed: $IMAGE@$DIGEST"
