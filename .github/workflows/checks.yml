name: Source checks

on:
  push:
    paths:
      - "arkad/**"
      - "arka-agent/**"
      - "arka-pulse/**"
      - "arka-shell/**"
      - "arkaos-oobe-apply"
      - "arkaos-firstboot"
      - "arka-plasma-firstrun"
      - "arkaos-settings"
      - "Containerfile"
      - "scripts/test-oobe-apply.py"
      - "arkaos-firefox"
      - "scripts/test-firefox-wrapper.py"
      - "scripts/flash-usb.sh"
      - "scripts/test-flash-preflight.py"
      - "systemd/arka-bootc-status.*"
      - ".github/workflows/checks.yml"
      - "convert/**"
      - "arka-arm-boot-counter"
      - "plymouth-theme-arkaos/**"
      - "scripts/test-arka-convert.py"
      - "scripts/test-wheel-formats.py"
      - "scripts/test-edit-window.py"
      - "scripts/test-arm-boot-counter.py"
      - "scripts/qml/**"
  pull_request:
    paths:
      - "arkad/**"
      - "arka-agent/**"
      - "arka-pulse/**"
      - "arka-shell/**"
      - "arkaos-oobe-apply"
      - "arkaos-firstboot"
      - "arka-plasma-firstrun"
      - "arkaos-settings"
      - "Containerfile"
      - "scripts/test-oobe-apply.py"
      - "arkaos-firefox"
      - "scripts/test-firefox-wrapper.py"
      - "scripts/flash-usb.sh"
      - "scripts/test-flash-preflight.py"
      - "systemd/arka-bootc-status.*"
      - ".github/workflows/checks.yml"
      - "convert/**"
      - "arka-arm-boot-counter"
      - "plymouth-theme-arkaos/**"
      - "scripts/test-arka-convert.py"
      - "scripts/test-wheel-formats.py"
      - "scripts/test-edit-window.py"
      - "scripts/test-arm-boot-counter.py"
      - "scripts/qml/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell helpers
        run: shellcheck arkaos-oobe-apply arka-plasma-firstrun arkaos-firefox arkaos-firstboot scripts/flash-usb.sh
      - name: Check first-run shell syntax
        run: bash -n arkaos-oobe-apply && bash -n arkaos-firstboot && bash -n arkaos-settings
      - name: Test setup with isolated accounts and paths
        run: python3 scripts/test-oobe-apply.py
      - name: Test USB source preflight without devices
        run: python3 scripts/test-flash-preflight.py
      - name: Test browser sandbox launch boundary
        run: bash -n arkaos-firefox && python3 scripts/test-firefox-wrapper.py
      - name: Test that the format wheel offers only what arka-convert accepts
        run: python3 scripts/test-wheel-formats.py
      - name: Test the boot counter's failure paths with fake commands
        run: sh -n arka-arm-boot-counter && python3 scripts/test-arm-boot-counter.py
      - name: Test arka install (permission wording and the app list)
        run: python3 -I -m unittest discover -s apps -p 'test_*.py'

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Test privacy enforcement
        # Authorization tests use their own session bus, never the host system bus.
        run: cargo test --locked --manifest-path arkad/Cargo.toml
      - name: Test reliability core
        run: cargo test --locked --manifest-path arka-pulse/Cargo.toml --features dbus
      - name: Test agent and daemon status contract
        run: cargo test --locked --manifest-path arka-agent/Cargo.toml
      - name: Test shared privacy states and tray
        run: cargo test --locked --manifest-path arka-shell/Cargo.toml -p arka-shell-common -p arka-privacy-tray

  desktop:
    runs-on: ubuntu-24.04
    # Same environment the image builds these apps in (Containerfile
    # shell-builder): Ubuntu has no gtk4-layer-shell, which the privacy dots need.
    container: docker.io/library/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build dependencies
        run: dnf install -y -q gtk4-devel gtk4-layer-shell-devel libadwaita-devel rust cargo gcc pkgconf-pkg-config
      - name: Test every desktop crate including first-run setup
        run: cargo test --locked --manifest-path arka-shell/Cargo.toml --workspace
      - name: Test desktop backends without a display or host services
        run: |
          rustc --edition=2021 --test arka-shell/arka-perms/src/permissions.rs -o /tmp/perms-tests
          /tmp/perms-tests
          rustc --edition=2021 --test arka-shell/arka-wifi/src/net.rs -o /tmp/wifi-tests
          /tmp/wifi-tests
          rustc --edition=2021 --test arka-shell/arka-sound/src/audio.rs -o /tmp/sound-tests
          /tmp/sound-tests
          rustc --edition=2021 --test arka-shell/arka-update/src/operation.rs -o /tmp/update-tests
          /tmp/update-tests

  convert:
    runs-on: ubuntu-24.04
    # The tools the image ships (ffmpeg, Pillow, mat2, tesseract, bubblewrap, Qt), so the converter, the
    # wheel and the edit window are tested against the same versions. Privileged: arka-convert runs every
    # tool in a bubblewrap sandbox, which needs user namespaces inside the job's container.
    container:
      image: docker.io/library/fedora:44
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install the converters and Qt
        run: |
          dnf install -y -q ffmpeg-free python3-pillow poppler-utils ghostscript bubblewrap mat2 \
            tesseract tesseract-langpack-eng cmake gcc-c++ extra-cmake-modules qt6-qtbase-devel \
            qt6-qtdeclarative-devel qt6-qtmultimedia kf6-kglobalaccel-devel kf6-kwindowsystem-devel \
            layer-shell-qt-devel dbus-daemon
      - name: Test arka-convert with real files in the real sandbox
        run: python3 scripts/test-arka-convert.py
      - name: Test the wheel's slots against arka-convert
        run: python3 scripts/test-wheel-formats.py
      - name: Test the wheel's QML
        run: QT_QPA_PLATFORM=offscreen /usr/lib64/qt6/bin/qmltestrunner -input scripts/qml/tst_format_wheel.qml
      - name: Build the edit window and the wheel
        run: cmake -S convert -B /tmp/convert-build -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/convert-build -j"$(nproc)"
      - name: Drive the edit window and check what it saves
        run: ARKA_EDIT=/tmp/convert-build/edit/arka-edit python3 scripts/test-edit-window.py
