name: Live ISO

# Builds the ArkaOS live ISO: a USB stick that starts Arka Install, which puts ArkaOS
# on a disk (next to Windows, on an empty disk, or over a whole disk). The ISO carries
# the image it installs, so installing needs no network.
#
# On test/* branches the image is built from the branch (it is not published) and the
# ISO is kept as a downloadable artifact for a few days. Not yet run on master.

on:
  push:
    branches: ["test/**"]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "assets/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: live-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Make room (image ~11 GB, live image, ISO ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost
          sudo mkdir -p /mnt/containers /var/lib/containers /mnt/out "$HOME/iso-work"
          sudo chown "$USER" /mnt/out
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt

      - uses: actions/checkout@v4

      # When only tests/live-iso changed since an ISO this branch already built, test that
      # ISO instead of building the same one again (about 12 minutes instead of 33).
      - name: Look for an ISO already built from the same sources
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=arkaos-live-iso&per_page=50" \
            --jq ".artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$GITHUB_REF_NAME\") | \"\(.workflow_run.id) \(.workflow_run.head_sha)\"" \
            | head -5 > "$RUNNER_TEMP/isos" || true
          while read -r run sha; do
            git fetch -q --depth=1 origin "$sha" || continue
            if git diff --quiet "$sha" HEAD -- . ':(exclude)tests/live-iso'; then
              echo "Testing the ISO from run $run (built from $sha): only tests/live-iso changed since."
              echo "run=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < "$RUNNER_TEMP/isos"
          echo "No ISO built from these sources yet: building one."

      - name: Download that ISO
        if: steps.reuse.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: arkaos-live-iso
          path: /mnt/out
          run-id: ${{ steps.reuse.outputs.run }}
          github-token: ${{ github.token }}

      - name: Check the downloaded ISO
        if: steps.reuse.outputs.run != ''
        run: cd /mnt/out && sha256sum -c arkaos-live.iso.sha256

      - name: Build the ArkaOS image from this branch
        if: steps.reuse.outputs.run == ''
        run: sudo podman build --pull=newer -t localhost/arka:build .

      - name: Save it as an OCI directory and read its release name
        if: steps.reuse.outputs.run == ''
        run: |
          ctx=$HOME/live-ctx
          mkdir -p "$ctx"
          cp installer/live/Containerfile installer/live/dracut-live.conf \
             installer/live/live-profile installer/live/49-arka-install-live.rules "$ctx/"
          sudo skopeo copy containers-storage:localhost/arka:build "oci:$ctx/image"
          sudo podman run --rm --net=none --entrypoint cat localhost/arka:build /etc/system-release \
            | sudo tee "$ctx/image.system-release"
          sudo du -sh "$ctx/image"

      - name: Build the live system
        if: steps.reuse.outputs.run == ''
        run: |
          sudo podman build --build-arg BASE=localhost/arka:build -t localhost/arka:live "$HOME/live-ctx"
          sudo rm -rf "$HOME/live-ctx"
          df -h / /mnt

      - name: Make the ISO
        id: iso
        if: steps.reuse.outputs.run == ''
        run: |
          sudo podman run --rm --privileged --security-opt label=disable \
            --mount type=image,source=localhost/arka:live,destination=/rootfs \
            -v "$PWD/installer/live/build-iso.sh:/build-iso.sh:ro" \
            -v /mnt/out:/output -v "$HOME/iso-work:/work" \
            quay.io/fedora/fedora:44 bash /build-iso.sh

      - name: Test the ISO in a VM (install next to a fake Windows, Secure Boot on)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils gdisk mtools dosfstools socat
          sudo modprobe vhost_vsock
          mkdir -p "$HOME/ovmf"
          sudo podman run --rm quay.io/fedora/fedora:44 bash -c \
            'dnf install -y -q edk2-ovmf >/dev/null && tar -C /usr/share/edk2/ovmf -c OVMF_CODE_4M.secboot.qcow2 OVMF_VARS_4M.secboot.qcow2' \
            | tar -x -C "$HOME/ovmf"
          sudo OVMF_CODE="$HOME/ovmf/OVMF_CODE_4M.secboot.qcow2" OVMF_VARS="$HOME/ovmf/OVMF_VARS_4M.secboot.qcow2" \
            bash tests/live-iso/run.sh /mnt/out/arkaos-live.iso /mnt/test-out

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-iso-test
          path: /mnt/test-out/
          retention-days: 7

      # Kept even when the test fails, so a test-only fix can reuse it.
      - name: Keep the ISO
        if: always() && steps.iso.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: arkaos-live-iso
          path: /mnt/out/
          retention-days: 3
          compression-level: 0
