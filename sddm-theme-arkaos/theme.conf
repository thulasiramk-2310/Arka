[General]
# Background image. System Settings > Login Screen can override this
# (it writes theme.conf.user next to this file).
background=/usr/share/arka/wallpapers/default.png
type=image

# Accent colour for focus rings, the sign-in button and highlights.
#   auto     follow the desktop accent (after "Apply Plasma Settings")
#   #rrggbb  a fixed colour of your choice
accent=auto

# Accent used when "auto" cannot read a desktop accent.
fallbackAccent=#16c784

# Look: dark (default) or light. The arkaos-light copy of this theme sets light.
look=dark
