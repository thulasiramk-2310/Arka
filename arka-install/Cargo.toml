[package]
name = "arka-install"
version = "0.1.0"
edition = "2021"
description = "ArkaOS installer backend: reads disks, plans an install with systemd-repart, installs with bootc"
license = "GPL-3.0-or-later"

[[bin]]
name = "arka-install"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
