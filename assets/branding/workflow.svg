<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Inter, 'Noto Sans', 'Segoe UI', sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5L7.5 4L0 7.5Z" fill="#8b96a5"/></marker></defs>
<rect width="1200" height="440" rx="12" fill="#07080e"/>
<text x="60" y="44" text-anchor="start" font-size="13" letter-spacing="3" fill="#7a8696">WHAT GITHUB ACTIONS DOES TODAY</text>
<text x="60" y="82" text-anchor="start" font-size="11" letter-spacing="1.5" fill="#7a8696">Image  (image.yml)</text>
<path d="M68 96H242L250 104V152L242 160H68L60 152V104Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="155.0" y="114.9" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Push, weekly, or by hand</text>
<text x="155.0" y="132.3" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">master or test/* branch;</text>
<text x="155.0" y="149.3" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">weekly, on Mondays</text>
<path d="M298 96H472L480 104V152L472 160H298L290 152V104Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="385.0" y="123.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">podman build</text>
<text x="385.0" y="140.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">the Containerfile</text>
<path d="M250 128.0 L290 128.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M528 96H702L710 104V152L702 160H528L520 152V104Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="615.0" y="123.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Split into small layers</text>
<text x="615.0" y="140.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">so an update downloads less</text>
<path d="M480 128.0 L520 128.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M758 96H932L940 104V152L932 160H758L750 152V104Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="845.0" y="123.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Push to ghcr.io</text>
<text x="845.0" y="140.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">master only</text>
<path d="M710 128.0 L750 128.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M988 96H1162L1170 104V152L1162 160H988L980 152V104Z" fill="#0f141a" stroke="#16c784" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="1075.0" y="123.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">cosign sign and verify</text>
<text x="1075.0" y="140.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">master only</text>
<path d="M940 128.0 L980 128.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<text x="60" y="190" text-anchor="start" font-size="11" letter-spacing="1.5" fill="#7a8696">Source checks  (checks.yml)</text>
<path d="M68 204H242L250 212V260L242 268H68L60 260V212Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="155.0" y="231.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Push or pull request</text>
<text x="155.0" y="248.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">touching the listed source paths</text>
<path d="M298 204H612L620 212V260L612 268H298L290 260V212Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="455.0" y="222.9" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Three test jobs</text>
<text x="455.0" y="240.3" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">shellcheck and Python tests; cargo test;</text>
<text x="455.0" y="257.3" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">desktop crates in a Fedora 44 container</text>
<path d="M250 236.0 L290 236.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<text x="60" y="298" text-anchor="start" font-size="11" letter-spacing="1.5" fill="#7a8696">Stick image  (disk.yml)</text>
<path d="M68 312H242L250 320V368L242 376H68L60 368V320Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="155.0" y="339.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Run by hand</text>
<text x="155.0" y="356.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">choose an image tag and size</text>
<path d="M298 312H472L480 320V368L472 376H298L290 368V320Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="385.0" y="339.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Check the signature</text>
<text x="385.0" y="356.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">cosign verify with cosign.pub</text>
<path d="M250 344.0 L290 344.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M528 312H702L710 320V368L702 376H528L520 368V320Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="615.0" y="339.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Install to a raw disk</text>
<text x="615.0" y="356.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">bootc install to-disk</text>
<path d="M480 344.0 L520 344.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M758 312H932L940 320V368L932 376H758L750 368V320Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="845.0" y="339.4" text-anchor="middle" font-size="13" font-weight="700" fill="#f5f7fa">Compress and keep</text>
<text x="845.0" y="356.8" text-anchor="middle" font-size="11" font-weight="400" fill="#a3adba">downloadable for 3 days</text>
<path d="M710 344.0 L750 344.0" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<text x="60" y="418" text-anchor="start" font-size="12" font-weight="400" fill="#7a8696">CI does not boot the image. Boot tests are run by hand in a VM (see docs/TESTING.md).</text>
</svg>
