<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, 'Noto Sans', 'Segoe UI', sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5L7.5 4L0 7.5Z" fill="#8b96a5"/></marker></defs>
<rect width="1200" height="760" rx="12" fill="#07080e"/>
<path d="M528.0 44H672.0L680.0 52V80L672.0 88H528.0L520.0 80V52Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="70.5" text-anchor="middle" font-size="15" font-weight="700" fill="#f5f7fa">You</text>
<path d="M600.0 88 L600.0 118" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter"/>
<path d="M258 118H942L950 126V222L942 230H258L250 222V126Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="161.0" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f7fa">Desktop</text>
<text x="600.0" y="181.4" text-anchor="middle" font-size="13" font-weight="400" fill="#a3adba">KDE Plasma on KWin, in the ArkaOS look</text>
<text x="600.0" y="200.4" text-anchor="middle" font-size="13" font-weight="400" fill="#a3adba">Dock · launcher · top bar · Dashboard, Capsule, Permissions, Settings</text>
<path d="M600.0 230 L600.0 260" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter"/>
<path d="M258 260H942L950 268V364L942 372H258L250 364V268Z" fill="#0f141a" stroke="#16c784" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="303.0" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f7fa">arkad, the privacy daemon</text>
<text x="600.0" y="323.4" text-anchor="middle" font-size="13" font-weight="400" fill="#a3adba">Applies and re-checks MAC randomization, encrypted DNS, hostname, IPv6 and firewall</text>
<text x="600.0" y="342.4" text-anchor="middle" font-size="13" font-weight="400" fill="#a3adba">About every minute. It reports what it checked, not what is protected.</text>
<path d="M600.0 372 L600.0 402" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter"/>
<path d="M258 402H942L950 410V506L942 514H258L250 506V410Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="445.0" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f7fa">Immutable image</text>
<text x="600.0" y="465.4" text-anchor="middle" font-size="13" font-weight="400" fill="#a3adba">bootc · composefs read-only root · atomic updates · rollback</text>
<text x="600.0" y="484.4" text-anchor="middle" font-size="13" font-weight="400" fill="#a3adba">The OS is one container image, signed in CI. The previous version stays for rollback.</text>
<path d="M600.0 514 L600.0 544" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter"/>
<path d="M258 544H942L950 552V620L942 628H258L250 620V552Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="582.5" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f7fa">Linux kernel</text>
<text x="600.0" y="602.9" text-anchor="middle" font-size="13" font-weight="400" fill="#a3adba">Fedora's kernel, with a few hardening options</text>
<path d="M600.0 628 L600.0 658" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter"/>
<path d="M528.0 658H672.0L680.0 666V694L672.0 702H528.0L520.0 694V666Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="684.5" text-anchor="middle" font-size="15" font-weight="700" fill="#f5f7fa">Hardware</text>
