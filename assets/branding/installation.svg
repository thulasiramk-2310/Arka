<text x="1000.0" y="195.7" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">First boot: ArkaOS setup</text>
<text x="1000.0" y="213.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">creates your account, then the desktop</text>
<text x="1000.0" y="231.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">the same setup program on every path</text>
<path d="M68 320H272L280 328V376L272 384H68L60 376V328Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="170.0" y="338.7" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">ghcr.io</text>
<text x="170.0" y="356.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">CI publishes it signed;</text>
<text x="170.0" y="374.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">installed systems update from here</text>
<path d="M170 253.0 L170 320" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
