<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, 'Noto Sans', 'Segoe UI', sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5L7.5 4L0 7.5Z" fill="#8b96a5"/></marker></defs>
<rect width="1200" height="420" rx="12" fill="#07080e"/>
<text x="60" y="44" text-anchor="start" font-size="13" letter-spacing="3" fill="#7a8696">ONE IMAGE, THREE WAYS ONTO A DISK</text>
<path d="M68 165.0H272L280 173.0V245.0L272 253.0H68L60 245.0V173.0Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="170.0" y="195.5" text-anchor="middle" font-size="15" font-weight="700" fill="#f5f7fa">Container image</text>
<text x="170.0" y="214.1" text-anchor="middle" font-size="12" font-weight="400" fill="#a3adba">one Containerfile</text>
<text x="170.0" y="232.1" text-anchor="middle" font-size="12" font-weight="400" fill="#a3adba">built and signed in CI</text>
<path d="M348 66H712L720 74V136L712 144H348L340 136V74Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="530.0" y="91.7" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">qcow2 disk image</text>
<text x="530.0" y="109.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">bootc-image-builder</text>
<text x="530.0" y="127.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">for VMs and testing</text>
<path d="M348 170H712L720 178V240L712 248H348L340 240V178Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="530.0" y="195.7" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">Raw disk image</text>
<text x="530.0" y="213.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">bootc install to-disk</text>
<text x="530.0" y="231.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">for a USB stick; tried on one laptop</text>
<path d="M348 274H712L720 282V344L712 352H348L340 344V282Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="530.0" y="299.7" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">Installer ISO</text>
<text x="530.0" y="317.7" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">bootc-image-builder with Anaconda; you pick the disk,</text>
<text x="530.0" y="335.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">encrypted by default (LUKS2). Tested in a VM only.</text>
