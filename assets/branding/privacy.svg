<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, 'Noto Sans', 'Segoe UI', sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5L7.5 4L0 7.5Z" fill="#8b96a5"/></marker></defs>
<rect width="1200" height="480" rx="12" fill="#07080e"/>
<text x="60" y="44" text-anchor="start" font-size="13" letter-spacing="3" fill="#7a8696">PRIVACY: THREE SEPARATE PIECES</text>
<text x="60" y="82" text-anchor="start" font-size="11" letter-spacing="2" fill="#7a8696">Browser</text>
<path d="M68 104H392L400 112V150L392 158H68L60 150V112Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="230.0" y="126.5" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">/usr/bin/firefox</text>
<text x="230.0" y="144.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">a wrapper script</text>
<path d="M230.0 158 L230.0 186" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M68 186H392L400 194V232L392 240H68L60 232V194Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="230.0" y="208.4" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">bubblewrap</text>
<text x="230.0" y="226.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">limits what the browser can see</text>
<path d="M230.0 240 L230.0 268" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M68 268H392L400 276V314L392 322H68L60 314V276Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="230.0" y="290.4" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">Firefox</text>
<text x="230.0" y="308.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">firefox-unwrapped</text>
<text x="60" y="356" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">Sees: ~/Downloads, a short list of /etc</text>
<text x="60" y="375" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">files, the display and audio sockets.</text>
<text x="60" y="394" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">Hidden: the rest of your home, session D-Bus.</text>
<text x="60" y="413" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">Audio access can include the microphone.</text>
<text x="430" y="82" text-anchor="start" font-size="11" letter-spacing="2" fill="#7a8696">Flatpak apps</text>
<path d="M438 104H762L770 112V150L762 158H438L430 150V112Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="126.5" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">Permissions app</text>
<text x="600.0" y="144.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">you flip a switch</text>
<path d="M600.0 158 L600.0 186" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M438 186H762L770 194V232L762 240H438L430 232V194Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="208.4" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">flatpak override --user</text>
<text x="600.0" y="226.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">writes the app's override file</text>
<path d="M600.0 240 L600.0 268" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M438 268H762L770 276V314L762 322H438L430 314V276Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="600.0" y="290.4" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">The Flatpak app</text>
<text x="600.0" y="308.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">its direct grants change</text>
<text x="430" y="356" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">Covers direct grants only: network, audio,</text>
<text x="430" y="375" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">devices, home, Downloads, Wayland.</text>
<text x="430" y="394" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">Portals and other paths are separate.</text>
<text x="800" y="82" text-anchor="start" font-size="11" letter-spacing="2" fill="#7a8696">Setting checks</text>
<path d="M808 104H1132L1140 112V150L1132 158H808L800 150V112Z" fill="#0f141a" stroke="#16c784" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="970.0" y="126.5" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">arkad</text>
<text x="970.0" y="144.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">re-checks about every minute</text>
<path d="M970.0 158 L970.0 186" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M808 186H1132L1140 194V232L1132 240H808L800 232V194Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="970.0" y="208.4" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">org.arka.arkad</text>
<text x="970.0" y="226.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">read-only status on the system D-Bus</text>
<path d="M970.0 240 L970.0 268" fill="none" stroke="#8b96a5" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#a)"/>
<path d="M808 268H1132L1140 276V314L1132 322H808L800 314V276Z" fill="#0f141a" stroke="#3a4656" stroke-width="1.25" stroke-linejoin="miter"/>
<text x="970.0" y="290.4" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f7fa">Dashboard and tray</text>
<text x="970.0" y="308.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a3adba">show what was last checked</text>
<text x="800" y="356" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">It checks settings, not traffic.</text>
<text x="800" y="375" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">A setting being on does not prove every</text>
<text x="800" y="394" text-anchor="start" font-size="12" font-weight="400" fill="#a3adba">app uses it.</text>
<text x="60" y="450" text-anchor="start" font-size="12" font-weight="400" fill="#7a8696">They work separately. No single piece sees every app or every connection.</text>
</svg>
