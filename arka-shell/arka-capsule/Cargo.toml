[package]
name = "arka-capsule"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "arka-capsule"
path = "src/main.rs"

[dependencies]
arka-shell-common = { path = "../arka-shell-common", features = ["adw"] }
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_5"] }
quick-xml = "0.41"
serde_json = "1"
glib = "0.20"
