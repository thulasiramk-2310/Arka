# ArkaOS boot menu: shown for 5 s, centred, in the ArkaOS theme. arka-grub-theme.service copies the
# theme to /boot/grub2/themes/arkaos. If the theme or a graphics module is missing, GRUB keeps its
# plain text menu, so the menu never stops working.
set timeout_style=menu
set timeout=5
if [ -f "$prefix/themes/arkaos/theme.txt" ]; then
  insmod all_video
  insmod gfxterm
  insmod gfxmenu
  insmod png
  loadfont "$prefix/themes/arkaos/sans-14.pf2"
  loadfont "$prefix/themes/arkaos/sans-18.pf2"
  loadfont "$prefix/themes/arkaos/sans-bold-18.pf2"
  set gfxmode=auto
  set gfxpayload=keep
  if terminal_output gfxterm; then
    set theme="$prefix/themes/arkaos/theme.txt"
  fi
fi
