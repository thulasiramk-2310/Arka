# Home of the first-boot setup account. Disk images made by `bootc install`
# copy it from the image's /var, but Anaconda (the installer ISO) does not, and
# a separate /home volume would hide it. Recreate it at boot when missing; "C"
# copies only if the file is absent, so nothing is overwritten.
d /var/home/arkasetup 0700 arkasetup arkasetup -
C /var/home/arkasetup/.bash_profile - - - - /usr/share/arkaos/arkasetup/.bash_profile
C /var/home/arkasetup/.hushlogin - - - - /usr/share/arkaos/arkasetup/.hushlogin
z /var/home/arkasetup/.bash_profile 0644 arkasetup arkasetup -
z /var/home/arkasetup/.hushlogin 0644 arkasetup arkasetup -
