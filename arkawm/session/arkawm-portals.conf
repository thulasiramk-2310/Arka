# Which portal backend answers apps in an ArkaWM session (installed as
# /usr/share/xdg-desktop-portal/arkawm-portals.conf). KDE's, as on the Plasma desktop: it gives
# apps the light or dark look, the accent colour and KDE's file dialogs. Settings also come from
# the GTK backend, as on Plasma: GTK apps read their icon theme and fonts there, and with KDE's
# answers alone they drew a "missing icon" picture instead of the Arka icons.
# Screen sharing and screenshots through the portal need KWin and do not work in ArkaWM yet.
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
