# arka-desk settings. Every line here is a default you can change.
#
# Copy the lines you want into  ~/.config/arkawm/desk.conf  and edit them there; that file wins
# over everything else. A whole theme of your own goes in  ~/.config/arkawm/themes/<name>/ :
# a theme.conf with any of these lines, plus any pictures and icons you want to replace
# (wallpaper.jpg, logo.png, frames/*.jpg, <icon>.svg). Whatever a theme leaves out is taken
# from the built-in one. Log out and in (or pick the theme again in quick settings) to apply.

# Which theme to start with: sky-blue, emerald, or the name of one of yours.
theme = sky-blue

[colors]
# Shared surfaces are neutral graphite; the accent is for the mark, the ring and highlights;
# "ok" is for the Privacy entry and settings that were read as configured.
background = #101820
panel = #18232F
panel_raised = #202D3B
border = #65758A
text = #EDF3FA
text_dim = #A8B6C7
accent = #76CFFF
accent_muted = #426F9D
ok = #35D89A
ok_muted = #1B7658
warn = #FFC98A

[look]
# 0 switches glows off, 1 is the designed strength, more is brighter.
glow = 1.0
# How solid the cards and menus are: 0 is clear glass, 1 is the designed strength.
panel_opacity = 1.0
font = "Inter", "Noto Sans", sans-serif
# How soft the wallpaper looks through the information cards, in design pixels. The menu and
# small cards get three quarters of it, the round buttons half. Only what is behind glass is
# softened, never the wallpaper itself. 0 switches the glass off (plain tinted panels).
blur = 18
# How pale the frosted glass is: 0 is clear, 0.10 a light frost, more is milkier.
frost = 0.10
# off: no entrance, menu or wallpaper animations.
motion = on

[wallpaper]
# A picture of your own (full path). Empty: the theme's wallpaper.jpg.
file =
# A folder of pictures to fade between, slowly. Empty: the theme's frames folder, if it has one.
frames =
living = on
# Seconds between pictures, and how long one fade takes in milliseconds.
every = 30
fade = 6000
# The picture is shown as it is: sharp, with its own colours. These are here for those who
# want otherwise. blur is in design pixels (0 is sharp); the other three are multipliers
# (1 leaves the picture as it is). Nothing is ever laid over the desktop.
blur = 0
brightness = 1.0
contrast = 1.0
saturation = 1.0
# Breathing light: the glowing paths in the rocks grow softly brighter and back, every
# breathe_every seconds. Only over the theme's own picture. Off by default: it repaints the
# screen several times a second, which costs a little power the whole time.
breathe = off
breathe_every = 7
breathe_strength = 0.8
# Morning haze: how far every colour is pulled towards haze_color (0 is none, 1 is all of it).
haze = 0
haze_color = #C9C6DC

[show]
ring = on
cards = on
# The two quote cards and the lines of text over the wallpaper (the [text] section below).
# Off: nothing is written over the picture.
quotes = off
captions = off
tasks = on

[menu]
# click: the menu opens when the round button is clicked. always: it stays open.
open = click

[text]
# An empty value hides that text. \n starts a new line.
brand = ArkaOS
wordmark = ArkaOS
top = PRIVACY BY DEFAULT. TRANSPARENCY BY DESIGN.
left = A\nCALMER\nAND FREER\nTOMORROW
quote_left = “ A computer\n   that respects you\n   works differently.”
quote_right = “ The six privacy settings\n   are on from the first boot,\n   and each one is\n   listed above.”
platform = YOU IN CONTROL
menu_hint = Open your world
bottom_left = SAME\nHARDWARE.\nA MORE PRIVATE\nYOU.
bottom_centre = BUILT ON LINUX\nFOR A MORE PRIVATE WORLD
bottom_right = READ-ONLY SYSTEM\nSIGNED UPDATES\nREVERSIBLE

[apps]
# The eight places on the ring, clockwise from the top:  name | icon | commands
# The icon is a file name in the theme folder (without .svg). Of several commands separated
# by ; the first one that is installed is started. "highlight" after a third | marks the entry.
1 = Browser | globe-bold | firefox; brave; falkon
2 = Store | shopping-bag-fill | plasma-discover; gnome-software
3 = Settings | gear-fill | arka-settings; systemsettings
4 = Dev Tools | code-bold | code; kate; gnome-text-editor
5 = System | cube-fill | plasma-systemmonitor; gnome-system-monitor; konsole -e htop
6 = Terminal | terminal-bold | konsole; kitty; foot
7 = Privacy | shield-green | arka-dashboard; systemsettings | highlight
8 = Files | folder-fill | dolphin; nautilus

[commands]
# What the menu and the top strip start.
all_apps = fuzzel; rofi -show drun
places = dolphin; nautilus
privacy = arka-dashboard; systemsettings
system = plasma-systemmonitor; gnome-system-monitor; konsole -e htop
# The arrow on the Updates card. Empty hides the arrow.
updates = arka-update; plasma-discover --mode update; gnome-software --mode updates
lock = ${ARKAWM_LOCKER:-swaylock}
log_out = loginctl terminate-session "$XDG_SESSION_ID"
restart = systemctl reboot
shut_down = systemctl poweroff
