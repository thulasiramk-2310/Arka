# Classic: ArkaOS's first look. The Arka triangle wallpaper of the Plasma desktop, graphite
# surfaces with the brand green, and Crystal Dock along the bottom for the apps instead of the
# ring. Icons and anything else not set here come from Sky Blue.
[colors]
background = #15171B
panel = #1C2027
panel_raised = #262B33
border = #5C6470
accent = #4DB491
accent_muted = #2C6B57

[wallpaper]
# installed with the Plasma desktop; a picture picked in quick settings still wins
file = /usr/share/arka/wallpapers/default-dark.png
living = off

[show]
ring = off

[dock]
command = /usr/libexec/arkawm/arka-classic-dock
