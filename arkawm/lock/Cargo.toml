[package]
name = "arka-lock"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ArkaWM lock screen: ext-session-lock through gtk4-layer-shell, password checked with PAM"

[workspace]

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-session-lock = { version = "0.4", features = ["v1_2"] }
serde_json = "1"

[profile.dev]
debug = false
