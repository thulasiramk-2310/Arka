# greenboot records the version to go back to from this unit's ExecStop.
# Upstream gives it no shutdown conflict (DefaultDependencies=no), so systemd
# never stopped it at shutdown and ExecStop never ran. Stop it with
# ostree-finalize-staged.service, which has the same lines; After= that unit
# (upstream) makes it stop first, while the update is still staged.
[Unit]
Conflicts=final.target
Before=final.target
