[package]
name = "arka-agent"
version = "0.1.0"
edition = "2021"
description = "On-device, approval-gated AI agent for ArkaOS. Local LLM only; the model can call tools, never touch the system directly."

[lib]
name = "arka_agent"
path = "src/lib.rs"

[[bin]]
name = "arka-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
# localhost Ollama over plain HTTP — no TLS backend needed
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
# real backend
zbus = { version = "4", features = ["tokio"] }                         # read org.arka.arkad properties
arka-pulse = { path = "../arka-pulse", default-features = false }      # in-process PulseEngine::health()

[profile.release]
opt-level = "z"
lto = true
strip = true
